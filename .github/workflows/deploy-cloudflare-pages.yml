name: Deploy to Cloudflare Pages

# The Cloudflare Pages project was created directly via `wrangler pages
# deploy` (CLI), not the dashboard's git-integration flow — that flow
# defaulted to creating a Workers resource instead of a Pages project for
# this repo (wrong deploy command, always failed). This workflow gives
# the same "push to main -> live" behavior without touching that broken
# dashboard flow again.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Deploy
        run: npx wrangler pages deploy . --project-name=dreviqstudio-com --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
