<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard | Dreviq Studio</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  .admin-header{ position:sticky; top:0; z-index:50; background:rgba(11,15,23,0.85); backdrop-filter:blur(16px); border-bottom:1px solid var(--border); }
  .admin-header .row{ height:64px; display:flex; align-items:center; justify-content:space-between; }
  .admin-header .brand{ display:flex; align-items:center; gap:10px; }
  .admin-header .brand img{ width:30px; height:30px; }
  .admin-header .brand span{ font-family:var(--disp); font-size:14px; font-weight:600; letter-spacing:0.16em; }
  .admin-main{ padding:48px 0 80px; }
  .admin-page-title{ font-size:26px; margin-bottom:6px; }
  .admin-page-sub{ color:var(--mid); font-size:14px; margin-bottom:32px; }
  .job-form{ padding:28px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:13px; color:var(--mid); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; padding:11px 14px; border-radius:10px; font-size:14px;
    background:rgba(255,255,255,0.03); border:1px solid var(--border); color:var(--hi);
    font-family:var(--body);
  }
  .field textarea{ min-height:96px; resize:vertical; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--border-hi); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .banner{ padding:14px 16px; border-radius:10px; font-size:13px; margin-bottom:22px; display:none; }
  .banner.info{ background:rgba(99,102,241,0.08); border:1px solid rgba(99,102,241,0.25); color:var(--indigo-soft); }
  .banner.error{ background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.3); color:#F87171; }
  .banner.show{ display:block; }
  .result-pre{ margin-top:16px; padding:14px; border-radius:10px; background:rgba(255,255,255,0.03); border:1px solid var(--border); font-size:12px; color:var(--mid); overflow-x:auto; white-space:pre-wrap; display:none; }
  .logout-btn{ background:none; border:1px solid var(--border); color:var(--mid); padding:8px 16px; border-radius:999px; font-size:13px; }
  .logout-btn:hover{ color:var(--hi); border-color:var(--border-hi); }
</style>
</head>
<body>

<header class="admin-header">
  <div class="wrap-lg row">
    <div class="brand">
      <img src="../logo-icon.png" alt="Dreviq Studio">
      <span>DREVIQ STUDIO — ADMIN</span>
    </div>
    <button class="logout-btn" id="logoutBtn">Log out</button>
  </div>
</header>

<main class="admin-main">
  <div class="wrap-sm">
    <h1 class="admin-page-title">New production brief</h1>
    <p class="admin-page-sub">Submit a client brief for the content engine.</p>

    <div class="banner info show" id="stubBanner">
      This queues a real job for the worker (Render background worker,
      polling every ~15s). Generation still takes real minutes once it
      picks the job up — this page will update automatically.
    </div>

    <div class="banner error" id="errorBanner"></div>

    <form id="jobForm" class="card job-form">
      <div class="field">
        <label for="clientName">Client name</label>
        <input type="text" id="clientName" name="clientName" required placeholder="e.g. Acme Fitness" />
      </div>

      <div class="field">
        <label for="prompt">Creative brief</label>
        <textarea id="prompt" name="prompt" required placeholder="e.g. 30s energetic ad for a protein bar, gym setting, confident tone"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="aspectRatio">Aspect ratio</label>
          <select id="aspectRatio" name="aspectRatio">
            <option value="16:9">16:9 (landscape)</option>
            <option value="9:16">9:16 (vertical)</option>
          </select>
        </div>
        <div class="field">
          <label for="sceneCount">Scene count</label>
          <input type="number" id="sceneCount" name="sceneCount" min="1" max="10" value="4" />
        </div>
      </div>

      <div class="field">
        <label for="masterFace">Reference face photo</label>
        <input type="file" id="masterFace" name="masterFace" accept="image/*" />
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Submit brief</button>
    </form>

    <div class="card job-status" id="jobStatus" style="display:none; margin-top:20px; padding:22px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <strong id="jobStatusLabel" style="font-family:var(--disp); font-size:15px;">Queued</strong>
        <span id="jobIdLabel" style="font-size:12px; color:var(--mid);"></span>
      </div>
      <div id="jobStatusBody" style="font-size:13px; color:var(--mid);"></div>
    </div>

    <pre class="result-pre" id="resultPre"></pre>
  </div>
</main>

<script>
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/admin-logout', { method: 'POST' });
    window.location.href = '/admin/login.html';
  });

  const form = document.getElementById('jobForm');
  const errorBanner = document.getElementById('errorBanner');
  const resultPre = document.getElementById('resultPre');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBanner.classList.remove('show');
    resultPre.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    const payload = {
      clientName: document.getElementById('clientName').value,
      prompt: document.getElementById('prompt').value,
      aspectRatio: document.getElementById('aspectRatio').value,
      sceneCount: Number(document.getElementById('sceneCount').value),
    };

    const faceFile = document.getElementById('masterFace').files[0];
    if (faceFile) {
      payload.masterFaceDataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(faceFile);
      });
    }

    try {
      const res = await fetch('/api/admin-submit-job', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (res.status === 401) {
        window.location.href = '/admin/login.html';
        return;
      }
      if (!res.ok) {
        errorBanner.textContent = (data.details ? data.details.join(', ') : data.error) || 'Submission failed.';
        errorBanner.classList.add('show');
      } else {
        pollJob(data.job.id);
      }
    } catch {
      errorBanner.textContent = 'Network error — try again.';
      errorBanner.classList.add('show');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit brief';
    }
  });

  const jobStatus = document.getElementById('jobStatus');
  const jobStatusLabel = document.getElementById('jobStatusLabel');
  const jobIdLabel = document.getElementById('jobIdLabel');
  const jobStatusBody = document.getElementById('jobStatusBody');
  let pollTimer = null;

  function renderJob(job) {
    jobStatus.style.display = 'block';
    jobIdLabel.textContent = job.id;
    jobStatusLabel.textContent = {
      queued: 'Queued — waiting for worker',
      processing: 'Processing…',
      complete: 'Complete',
      failed: 'Failed',
    }[job.status] || job.status;

    if (job.status === 'complete') {
      const videoLink = job.resultVideoPathname
        ? `<a href="/api/admin-job-file?path=${encodeURIComponent(job.resultVideoPathname)}" class="btn btn-sm btn-primary" download>Download video</a>`
        : '';
      const srtLink = job.resultSrtPathname
        ? `<a href="/api/admin-job-file?path=${encodeURIComponent(job.resultSrtPathname)}" class="btn btn-sm btn-ghost" download style="margin-left:8px;">Download subtitles</a>`
        : '';
      jobStatusBody.innerHTML = videoLink + srtLink;
    } else if (job.status === 'failed') {
      jobStatusBody.textContent = job.error || 'Unknown error.';
    } else {
      jobStatusBody.textContent = 'Last updated: ' + new Date(job.updatedAt).toLocaleTimeString();
    }
  }

  function pollJob(id) {
    if (pollTimer) clearInterval(pollTimer);
    const check = async () => {
      try {
        const res = await fetch(`/api/admin-job-status?id=${encodeURIComponent(id)}`);
        if (res.status === 401) {
          window.location.href = '/admin/login.html';
          return;
        }
        if (!res.ok) return;
        const job = await res.json();
        renderJob(job);
        if (job.status === 'complete' || job.status === 'failed') {
          clearInterval(pollTimer);
        }
      } catch {
        /* transient network error while polling — try again next tick */
      }
    };
    check();
    pollTimer = setInterval(check, 8000);
  }
</script>
</body>
</html>
